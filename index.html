<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
  </head>
  <script src="./index.js"></script>
  <body style="margin: 0; padding: 0;">
    <canvas id="watch" width="1280" height="1280" style="height: min(95vh, 95vw); width: min(95vh, 95vw);">
    </canvas>
    <div>
      <form>
        <select id="beat-rate" />
          <option value="1">1</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="10">10</option>
        <input id="bezel-color" type="color" />
        <input id="dial-color" type="color" />
        <input id="dial-indexes-color" type="color" />
        <input id="hand-color" type="color" />
        <input id="shadow-color" type="color" />
        <select id="preset"></select>
      </form>
    </div>
  </body>
</html>
