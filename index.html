<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
  </head>
  <script src="./index.js"></script>
  <body style="margin: 0; padding: 0;">
    <canvas id="watch" width="1280" height="1280" style="height: 95vh; aspect-ratio: 1 / 1;">
    </canvas>
    <div>
      <form>
        <input id="beat-rate" type="number" min="5" max="10" />
        <input id="bezel-color" type="color" />
        <input id="dial-color" type="color" />
        <input id="dial-indexes-color" type="color" />
        <input id="hand-color" type="color" />
        <input id="shadow-color" type="color" />
        <select id="preset"></select>
      </form>
    </div>
  </body>
</html>
