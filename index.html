<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Watch</title>
    <meta property="og:title" content="Watch" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://syusui.net/watch/" />
    <meta property="og:image" content="https://syusui.net/watch/ogp.jpg" />
    <meta property="og:description" content="A watch." />
  </head>
  <script src="./index.js"></script>
  <body style="margin: 0; padding: 0;">
    <canvas id="watch" width="1280" height="1280" style="height: min(95vh, 95vw); width: min(95vh, 95vw);">
    </canvas>
    <div>
      <form>
        <select id="beat-rate">
          <option value="1">1</option>
          <option value="5">5 (18000)</option>
          <option value="6">6 (21600)</option>
          <option value="7">7 (25200)</option>
          <option value="8">8 (28800)</option>
          <option value="10">10 (36000)</option>
        </select>
        <input id="bezel-color" type="color" />
        <input id="dial-color" type="color" />
        <input id="dial-indexes-color" type="color" />
        <input id="hand-color" type="color" />
        <input id="shadow-color" type="color" />
        <select id="preset"></select>
        <button id="play-tick" type="button">Sound</button>
      </form>
    </div>
  </body>
</html>
